<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>پنل مدیریت | لیست قیمت</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="admin-body">
  <header class="admin-header">
    <h1>پنل مدیریت لیست قیمت</h1>
  </header>

  <div class="admin-container">
    <div class="help-box">
      <strong>راهنمای سریع:</strong>
      بعد از هر تغییر (افزودن، ویرایش، حذف یا جابه‌جایی) حتماً دکمه «دانلود فایل products.js» را بزنید
      و فایل دانلود‌شده را جایگزین فایل قبلی در پوشه پروژه کنید.
      سپس صفحه مشتری را رفرش کنید تا تغییرات اعمال شود.
    </div>

    <div class="admin-actions">
      <button class="btn btn-primary" onclick="openAddForm()">+ افزودن محصول</button>
      <button class="btn btn-secondary" onclick="downloadProductsFile()">دانلود فایل products.js</button>
      <a class="btn btn-outline" href="index.html" target="_blank">مشاهده صفحه مشتری</a>
    </div>

    <!-- فرم افزودن / ویرایش -->
    <div class="form-card" id="form-card" style="display: none;">
      <h2 id="form-title">افزودن محصول جدید</h2>
      <input type="hidden" id="edit-id">

      <div class="form-group">
        <label for="input-name">نام محصول</label>
        <input type="text" id="input-name" placeholder="مثلاً: لوبیا چیتی" autocomplete="off">
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="input-unit">قیمت واحد (تومان)</label>
          <input type="number" id="input-unit" placeholder="200000" min="0" step="1000">
        </div>
        <div class="form-group">
          <label for="input-pack">قیمت بسته ۵ کیلویی (اختیاری)</label>
          <input type="number" id="input-pack" placeholder="خالی = بدون بسته" min="0" step="1000">
        </div>
      </div>

      <div class="form-group">
        <label for="input-image">مسیر عکس (نسبت به ریشه پروژه)</label>
        <input type="text" id="input-image" placeholder="lobia.jpg">
      </div>

      <div class="form-group" style="display:flex; align-items:center; gap:10px; margin-top:8px;">
        <input type="checkbox" id="input-available" checked style="width:18px; height:18px;">
        <label for="input-available" style="margin:0; font-weight:600;">موجود است (اگر خاموش باشد «در حال تامین» نمایش داده می‌شود)</label>
      </div>

      <div class="modal-actions">
        <button class="btn btn-primary" onclick="saveProduct()">ذخیره</button>
        <button class="btn btn-outline" onclick="cancelForm()">انصراف</button>
      </div>
    </div>

    <h2 style="margin: 20px 0 12px; font-size: 1.1rem;">محصولات فعلی</h2>
    <div id="admin-list">
      <!-- لیست اینجا رندر می‌شود -->
    </div>
  </div>

  <script src="products.js"></script>
  <script src="script.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      loadAdminData();
    });
  </script>
</body>
</html>
